server:
  port: 9010

spring:
  application:
    name: booking-mcp-server
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: ${spring.application.name}
        version: 0.0.1
        # Must be set explicitly: without it Spring AI falls back to the legacy SSE transport (/sse).
        # STATELESS = Streamable HTTP without server-side MCP sessions, so it scales across pods.
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /mcp
  security:
    oauth2:
      client:
        # Token for downstream services; clients opt in with @ClientRegistrationId("backend").
        # Set AUTH_BASE_URL, AUTH_CLIENT_ID and AUTH_CLIENT_SECRET in the environment; never commit them.
        registration:
          backend:
            client-id: ${AUTH_CLIENT_ID}
            client-secret: ${AUTH_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: client_credentials
            provider: backend
        provider:
          backend:
            token-uri: ${AUTH_BASE_URL}/oauth2/token
  http:
    serviceclient:
      # One group per downstream service (clients/<service>/), named like specs/<service>/
      availabilities:
        base-url: ${AVAILABILITIES_BASE_URL:http://localhost:9008}
        connect-timeout: 2s
        read-timeout: 20s

management:
  endpoints:
    web:
      exposure:
        include: health
